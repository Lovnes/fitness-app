name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & boundary tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 (ubuntu-latest) only ships Python >= 3.10, so the
          # 3.9 run (matches the local macOS Python) uses the 24.04 image.
          - { python: "3.9",  os: ubuntu-24.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests with coverage
        run: |
          pip install coverage
          coverage run --source=fitness -m unittest discover -s tests -v
          coverage report -m --fail-under=90

      - name: COCOMO size report
        run: python tools/cocomo.py

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # needed to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install buildozer "cython==0.29.36"

      - name: Cache Buildozer toolchain (SDK, NDK, python-for-android)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fittrack-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/*.apk --generate-notes --title "FitTrack $GITHUB_REF_NAME"
