name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Typecheck, lint & unit/boundary tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Jest (unit, boundary, state machine) with coverage
        run: npx jest --ci --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: mobile/coverage/lcov-report

      - name: SUS scorer tests + COCOMO size report
        working-directory: .
        run: |
          python3 -m unittest discover -s tools -p "test_*.py" -v
          python3 tools/cocomo.py

  # ---------------------------------------------------------------- Android --
  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Generate native Android project (Expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Report build error
        if: failure()
        working-directory: .
        run: '[ -f android-build.log ] && python3 .github/scripts/report_build_error.py android-build.log Android || true'

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: fittrack-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/*.apk --clobber || gh release create "$GITHUB_REF_NAME" android/app/build/outputs/apk/release/*.apk --generate-notes --title "FitTrack $GITHUB_REF_NAME"

  # -------------------------------------------------------------------- iOS --
  # Builds an UNSIGNED app for the iOS Simulator. Installing on a real iPhone
  # needs an Apple Developer account and signing (or `eas build`).
  ios:
    name: iOS (Simulator build)
    needs: test
    runs-on: macos-26   # Expo SDK 58 requires Xcode 26.4+
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - run: npm ci

      - name: Generate native iOS project + install pods (Expo prebuild)
        run: npx expo prebuild --platform ios

      - name: Compile for iOS Simulator (unsigned)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace FitTrack.xcworkspace -scheme FitTrack \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$GITHUB_WORKSPACE/ios-build.log"
          ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/FitTrack.app \
            "$GITHUB_WORKSPACE/FitTrack-simulator.app.zip"

      - name: Report build error
        if: failure()
        working-directory: .
        run: '[ -f ios-build.log ] && python3 .github/scripts/report_build_error.py ios-build.log iOS || true'

      - name: Upload Simulator app
        uses: actions/upload-artifact@v5
        with:
          name: fittrack-ios-simulator
          path: FitTrack-simulator.app.zip
          if-no-files-found: error
